<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de Clientes</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1>Cadastro de Clientes</h1>

    <div id="mensagem" class="mensagem" hidden></div>

    <form id="form-cliente" class="card" novalidate>
      <h2>Novo cliente</h2>

      <div class="grid">
        <div class="campo col-2">
          <label for="nome">Nome</label>
          <input type="text" id="nome" required>
        </div>

        <div class="campo col-2">
          <label for="email">E-mail</label>
          <input type="email" id="email" required>
        </div>

        <div class="campo">
          <label for="cep">CEP</label>
          <div class="cep-linha">
            <input type="text" id="cep" placeholder="00000-000" maxlength="9" inputmode="numeric" required>
            <button type="button" id="btn-pesquisar" class="btn secundario">Pesquisar</button>
          </div>
        </div>

        <div class="campo col-2">
          <label for="logradouro">Rua</label>
          <input type="text" id="logradouro" required>
        </div>

        <div class="campo">
          <label for="numero">Número</label>
          <input type="text" id="numero" required>
        </div>

        <div class="campo">
          <label for="complemento">Complemento</label>
          <input type="text" id="complemento">
        </div>

        <div class="campo">
          <label for="bairro">Bairro</label>
          <input type="text" id="bairro" required>
        </div>

        <div class="campo">
          <label for="cidade">Cidade</label>
          <input type="text" id="cidade" required>
        </div>

        <div class="campo">
          <label for="uf">UF</label>
          <input type="text" id="uf" maxlength="2" required>
        </div>
      </div>

      <div class="acoes">
        <button type="submit" id="btn-salvar" class="btn">Salvar</button>
        <button type="reset" class="btn secundario">Limpar</button>
      </div>
    </form>

    <section class="card">
      <div class="lista-topo">
        <h2>Clientes cadastrados</h2>
        <button type="button" id="btn-atualizar" class="btn secundario">Atualizar lista</button>
      </div>

      <div class="tabela-wrap">
        <table>
          <thead>
            <tr>
              <th>Nome</th>
              <th>E-mail</th>
              <th>CEP</th>
              <th>Endereço</th>
              <th>Bairro</th>
              <th>Cidade/UF</th>
            </tr>
          </thead>
          <tbody id="lista"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
